<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Stylesheet is separated to maintain logic focus and reduce file size -->
  <?!= include('Stylesheet'); ?>
</head>
<body>

<div class="container">
  <div class="header-container">
    <h2>Drive Shallow Mover</h2>
    <span id="userInfo" class="user-info">👤 <span id="userEmail">Loading...</span></span>
  </div>

  <div id="searchSection" class="section">
    <div class="accordion-header" onclick="toggleAccordion('searchSection')">
      <span class="section-title">1. 検索条件の設定 (GUI)</span>
      <span class="accordion-arrow">▼</span>
    </div>
    <div class="results-content">
      <div class="grid" style="margin-top: 15px;">
        <div class="field">
          <label>📂 場所 (Location)</label>
          <select id="parentType" onchange="updateQuery(true)">
            <option value="root">マイドライブ直下 ('root')</option>
            <option value="custom">特定のフォルダID直下</option>
            <option value="any">場所を問わない</option>
          </select>
          <div id="customParentArea" style="display:none; margin-top:5px;" class="input-with-btn">
            <input type="text" id="customParentId" placeholder="フォルダIDを入力" oninput="updateQuery(true)">
            <button class="btn btn-outline btn-small" onclick="openPicker('customParentId')">選択</button>
          </div>
        </div>
        <div class="field"><label>🏷️ ファイル名 (Name contains)</label><input type="text" id="fileName" placeholder="例: 2025_レポート" oninput="updateQuery(true)"></div>
        <div class="field"><label>🚫 除外するファイル名 (Name does not contain)</label>
          <div class="exclude-inputs">
            <input type="text" id="fileNameExclude1" placeholder="除外1" oninput="updateQuery(true)">
            <input type="text" id="fileNameExclude2" placeholder="除外2" oninput="updateQuery(true)">
            <input type="text" id="fileNameExclude3" placeholder="除外3" oninput="updateQuery(true)">
            <input type="text" id="fileNameExclude4" placeholder="除外4" oninput="updateQuery(true)">
            <input type="text" id="fileNameExclude5" placeholder="除外5" oninput="updateQuery(true)">
          </div>
        </div>
        <div class="field">
          <label>🧩 ファイル形式 (MimeType)</label>
          <select id="mimeType" onchange="updateQuery(true)">
            <option value="">すべて</option>
            <option value="text/markdown">マークダウン (.md)</option>
            <option value="application/vnd.google-apps.spreadsheet">スプレッドシート</option>
            <option value="application/vnd.google-apps.document">ドキュメント</option>
            <option value="application/vnd.google-apps.presentation">スライド</option>
            <option value="application/vnd.google-apps.form">Google フォーム</option>
            <option value="application/pdf">PDF</option>
            <option value="text/plain">プレーンテキスト</option>
            <option value="image/">画像全般</option>
            <option value="video/">動画全般</option>
            <option value="application/zip">アーカイブ (zip等)</option>
            <option value="application/vnd.google-apps.folder">フォルダ</option>
            <option value="application/vnd.google-apps.script">Google Apps Script</option>
            <option value="application/vnd.google-apps.shortcut">ショートカット</option>
          </select>
        </div>
        <div class="field">
          <label>👤 所有者 (Owner)</label>
          <select id="ownerType" onchange="updateQuery(true)">
            <option value="">指定なし</option>
            <option value="me">自分が所有</option>
            <option value="notMe">自分以外が所有</option>
          </select>
        </div>
        <div class="field"><label>📝 本文 (Full text contains)</label><input type="text" id="fullText" placeholder="例: 重要機密" oninput="updateQuery(true)"></div>
        <div class="field"><label>💬 説明文 (Description contains)</label><input type="text" id="description" placeholder="例:補足説明" oninput="updateQuery(true)"></div>
        
        <div class="filter-group">
          <label>📅 最終更新日時 (Modified Time)</label>
          <div class="filter-options">
            <label class="filter-option-label"><input type="radio" name="dateMode" value="none" checked onchange="toggleDateInputs()"> 指定なし</label>
            <label class="filter-option-label"><input type="radio" name="dateMode" value="absolute" onchange="toggleDateInputs()"> 日付範囲</label>
            <label class="filter-option-label"><input type="radio" name="dateMode" value="relative" onchange="toggleDateInputs()"> 相対指定</label>
          </div>
          <div id="dateAbsolute" class="filter-inputs input-disabled" style="display:flex;">
            <div class="filter-input-wrapper"><span>👉 以後:</span><input type="date" id="dateAfter" oninput="updateQuery(true)"></div>
            <div class="filter-input-wrapper"><span>👈 以前:</span><input type="date" id="dateBefore" oninput="updateQuery(true)"></div>
          </div>
          <div id="dateRelative" class="filter-inputs input-disabled" style="display:none;">
            <div class="filter-input-wrapper">
              <span>現在から</span>
              <input type="number" id="relativeDays" value="7" min="0" style="width:60px;" oninput="updateQuery(true)">
              <span>日</span>
              <select id="relativeOperator" onchange="updateQuery(true)">
                <option value="older">以前</option>
                <option value="newer">以後</option>
              </select>
            </div>
          </div>
        </div>
        
        <div class="filter-group">
          <label>📏 ファイルサイズ (Size)</label>
          <div class="filter-inputs">
            <div class="filter-input-wrapper"><span>＞</span><input type="number" id="sizeLarger" min="0" step="0.1" style="width:80px;" oninput="updateQuery(true)"><select id="sizeLargerUnit" onchange="updateQuery(true)"><option value="1">B</option><option value="1024">KB</option><option value="1048576" selected>MB</option><option value="1073741824">GB</option></select></div>
            <div class="filter-input-wrapper"><span>＜</span><input type="number" id="sizeSmaller" min="0" step="0.1" style="width:80px;" oninput="updateQuery(true)"><select id="sizeSmallerUnit" onchange="updateQuery(true)"><option value="1">B</option><option value="1024">KB</option><option value="1048576" selected>MB</option><option value="1073741824">GB</option></select></div>
          </div>
        </div>
      </div>
    </div>
    <div class="query-display-wrapper" onclick="ensureSearchSectionOpen()" title="クリックして検索条件を表示">
      <div class="query-header">
        <label>組み立てられた q パラメータ:</label>
        <button class="btn-copy" id="copyBtn" onclick="event.stopPropagation(); copyQueryToClipboard()">📋 コピー</button>
      </div>
      <div class="query-content"><code id="qResult">trashed = false</code></div>
      <div id="saveStatus" class="status-msg"></div>
    </div>
    <button class="btn" id="searchBtn" style="margin-top:20px;" onclick="runSearch()">この条件で検索を実行 (最大20件)</button>
  </div>

  <div id="resultsSection" class="section" style="display:none;">
    <div class="accordion-header" onclick="toggleAccordion('resultsSection')">
      <span class="section-title">2. 検索結果・対象の選択 <span id="itemCountBadge" class="count-badge" style="display:none;">0</span> <span id="selectionCountBadge" class="count-badge" style="display:none;">選択中: 0</span></span>
      <span class="accordion-arrow">▼</span>
    </div>
    <div class="results-content">
      <div id="loadingSearch" class="loading">検索中...</div>
      <div class="tabs-container">
        <div class="tabs">
          <div id="tabFolders" class="tab" onclick="switchResultTab('folders')">フォルダ <span id="folderTabCount" class="count-badge">0</span></div>
          <div id="tabFiles" class="tab active" onclick="switchResultTab('files')">ファイル <span id="fileTabCount" class="count-badge">0</span></div>
        </div>
        <div id="analyzeBtnContainer"><button class="btn btn-outline btn-small" id="analyzeBtn" onclick="runAnalyzeFolders()">📊 内訳を集計</button></div>
      </div>
      <div id="foldersContent" class="tab-content"><table id="folderTable"><thead><tr><th style="width:40px;"><input type="checkbox" id="selectAllFolders" onchange="toggleSelectAll('folders')"></th><th>フォルダ名</th><th>内訳</th><th>最終更新</th></tr></thead><tbody></tbody></table></div>
      <div id="filesContent" class="tab-content active"><table id="fileTable"><thead><tr><th style="width:40px;"><input type="checkbox" id="selectAllFiles" onchange="toggleSelectAll('files')"></th><th>ファイル名</th><th>最終更新</th><th>サイズ</th></tr></thead><tbody></tbody></table></div>
      <div id="fetchMoreArea" class="fetch-more-area" style="display:none;">
        <div class="fetch-more-control">
          <span>取得件数:</span>
          <select id="fetchLimit"><option value="100" selected>100件</option><option value="200">200件</option><option value="500">500件</option><option value="1000">1000件</option><option value="-1">全て</option></select>
          <button class="btn btn-outline" id="fetchAllBtn" onclick="runFetchAll()">追加で読み込む</button>
        </div>
      </div>
    </div>
  </div>

  <div id="moveSection" class="section" style="display:none;">
    <span class="section-title">3. ファイルの移動</span>
    <div class="field"><label>移動先フォルダID</label>
      <div class="input-with-btn"><input type="text" id="destFolderId" placeholder="フォルダIDを入力" oninput="updateDestPath(); updateQuery(true)"><button class="btn btn-outline btn-small" onclick="openPicker('destFolderId')">選択</button></div>
      <div id="destPathDisplay" class="path-display"></div>
    </div>
    <button class="btn btn-secondary" id="moveBtn" style="margin-top:10px;" onclick="runMove()">選択したアイテムを移動する</button>
    <div id="moveProgressArea" style="display:none; margin-top:15px; background:#fff; padding:15px; border-radius:4px; border:1px solid #ffe0b2;">
      <div class="progress-text" id="moveProgressText">準備中...</div>
      <div class="progress-bar-container"><div id="moveProgressBar" class="progress-bar"></div></div>
      <div id="moveLog" class="log-area"></div>
      <div id="moveErrorSummary" class="error-summary"></div>
    </div>
  </div>
</div>

<div id="folderPickerModal"><div class="modal-content"><div class="modal-header"><h3>フォルダを選択<span id="cacheIndicator" class="cache-status" style="display:none;"></span></h3><div><button id="pickerUpBtn" class="btn btn-outline btn-small" disabled>⬆️ 親へ</button> <button class="btn btn-outline btn-small" onclick="refreshPicker()">🔄 更新</button><button class="btn btn-outline btn-small" onclick="closePicker()">×</button></div></div><div class="breadcrumb" id="pickerBreadcrumb"></div><div class="modal-body" id="pickerBody"></div><div class="modal-footer"><span id="selectedFolderName" style="margin-right:auto;font-weight:bold;">未選択</span><button class="btn btn-secondary" onclick="closePicker()">キャンセル</button><button class="btn" id="confirmPickBtn" disabled onclick="confirmPicker()">決定</button></div></div></div>

<script>
  // --- Global State ---
  let saveTimeout = null;
  let currentTargetInputId = '';
  let selectedFolderInfo = null;
  let fetchAllTimer = null;
  let pathDebounceTimer = null;
  let currentPickerFolderId = 'root';
  
  let currentNextPageToken = null;
  let currentLastQuery = '';
  let loadedFilesCount = 0;
  let folderCount = 0;
  let fileCount = 0;
  let currentFolderIds = [];
  let fileNamesMap = {};

  // --- Initialization ---
  function initApp() {
    console.log('Preview Mode Initialized');
    document.getElementById('userEmail').textContent = 'preview_user@example.com';
    updateQuery(false);
  }

  window.onload = function() {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      initApp(); return;
    }
    if (typeof window.initApp === 'function') window.initApp(); 
  };

  // --- UI Helpers ---
  function toggleAccordion(id, forceOpen) {
    const el = document.getElementById(id);
    if (forceOpen === true) el.classList.remove('accordion-collapsed');
    else if (forceOpen === false) el.classList.add('accordion-collapsed');
    else el.classList.toggle('accordion-collapsed');
  }

  function ensureSearchSectionOpen() { toggleAccordion('searchSection', true); }

  function switchResultTab(t) {
    document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.id === (t === 'folders' ? 'tabFolders' : 'tabFiles')));
    document.getElementById('foldersContent').classList.toggle('active', t === 'folders');
    document.getElementById('filesContent').classList.toggle('active', t === 'files');
    document.getElementById('analyzeBtnContainer').style.display = t === 'folders' ? 'block' : 'none';
  }

  function toggleDateInputs(shouldSave = true) {
    const mode = document.querySelector('input[name="dateMode"]:checked')?.value || 'none';
    const abs = document.getElementById('dateAbsolute'), rel = document.getElementById('dateRelative');
    const setState = (el, enable) => {
      el.style.display = enable ? 'flex' : 'none';
      el.classList.toggle('input-disabled', !enable);
      el.querySelectorAll('input, select').forEach(i => i.disabled = !enable);
    };
    setState(abs, mode === 'absolute' || mode === 'none'); 
    setState(rel, mode === 'relative');
    if(mode === 'none') { abs.querySelectorAll('input').forEach(i => i.disabled = true); abs.classList.add('input-disabled'); }
    updateQuery(shouldSave);
  }

  function updateSelectionCount() {
    const count = document.querySelectorAll('.file-check:checked').length;
    const badge = document.getElementById('selectionCountBadge');
    if (count > 0) { badge.textContent = `選択中: ${count}`; badge.style.display = 'inline-block'; } 
    else { badge.style.display = 'none'; }
    syncSelectAllCheckbox('folders'); syncSelectAllCheckbox('files');
  }

  function syncSelectAllCheckbox(type) {
    const tableId = type === 'folders' ? 'folderTable' : 'fileTable';
    const headerCheckbox = document.getElementById(type === 'folders' ? 'selectAllFolders' : 'selectAllFiles');
    if(!headerCheckbox) return;
    const checkboxes = document.querySelectorAll(`#${tableId} tbody .file-check`);
    if (checkboxes.length === 0) { headerCheckbox.checked = false; return; }
    headerCheckbox.checked = Array.from(checkboxes).every(cb => cb.checked);
  }

  function toggleSelectAll(t) {
    const checked = document.getElementById(t === 'folders' ? 'selectAllFolders' : 'selectAllFiles').checked;
    document.querySelectorAll(`#${t === 'folders' ? 'folderTable' : 'fileTable'} tbody .file-check`).forEach(cb => cb.checked = checked);
    updateSelectionCount();
  }

  function copyQueryToClipboard() {
    const text = document.getElementById('qResult').textContent;
    const temp = document.createElement("textarea"); temp.value = text; document.body.appendChild(temp); temp.select();
    document.execCommand('copy'); document.body.removeChild(temp);
    const btn = document.getElementById('copyBtn'); const old = btn.textContent; btn.textContent = '✅ コピー完了'; setTimeout(() => btn.textContent = old, 1500);
  }

  // --- Core Logic: Query Construction (FULLY IMPLEMENTED) ---
  function updateQuery(shouldSave) {
    let parts = ['trashed = false'];
    const val = id => {
      const el = document.getElementById(id);
      return el ? el.value.replace(/'/g, "\\'") : '';
    };

    // 1. Location
    const pType = document.getElementById('parentType').value;
    if (pType === 'root') parts.push("'root' in parents");
    else if (pType === 'custom' && val('customParentId')) parts.push(`'${val('customParentId')}' in parents`);
    const customArea = document.getElementById('customParentArea');
    if(customArea) customArea.style.display = pType === 'custom' ? 'flex' : 'none';

    // 2. Name
    if (val('fileName')) parts.push(`name contains '${val('fileName')}'`);
    for(let i=1; i<=5; i++) { if(val('fileNameExclude'+i)) parts.push(`not name contains '${val('fileNameExclude'+i)}'`); }

    // 3. MimeType (Markdown handled as OR)
    const mime = document.getElementById('mimeType').value;
    if (mime) {
      if (mime === 'text/markdown') parts.push("(mimeType = 'text/markdown' or (mimeType = 'text/plain' and name contains '.md'))");
      else if (mime.endsWith('/')) parts.push(`mimeType contains '${mime}'`);
      else parts.push(`mimeType = '${mime}'`);
    }

    // 4. Owner
    const owner = document.getElementById('ownerType').value;
    if (owner === 'me') parts.push("'me' in owners");
    else if (owner === 'notMe') parts.push("not 'me' in owners");

    // 5. FullText (maps UI fullText AND description to fullText parameter)
    if (val('fullText')) parts.push(`fullText contains '${val('fullText')}'`);
    if (val('description')) parts.push(`fullText contains '${val('description')}'`);

    // 6. Modified Time
    const dateMode = document.querySelector('input[name="dateMode"]:checked')?.value;
    if (dateMode === 'absolute') {
      if (val('dateAfter')) parts.push(`modifiedTime >= '${new Date(val('dateAfter')).toISOString()}'`);
      if (val('dateBefore')) { 
        let d = new Date(val('dateBefore')); d.setHours(23, 59, 59, 999); 
        parts.push(`modifiedTime <= '${d.toISOString()}'`); 
      }
    } else if (dateMode === 'relative') {
      const days = parseInt(val('relativeDays')) || 0;
      const op = document.getElementById('relativeOperator').value === 'older' ? '<' : '>';
      const targetDate = new Date(); targetDate.setDate(targetDate.getDate() - days);
      parts.push(`modifiedTime ${op} '${targetDate.toISOString()}'`);
    }

    // Update Display
    document.getElementById('qResult').textContent = parts.join(' and ');

    // Persistence
    if (shouldSave && typeof window.debounceSave === 'function') {
      const settings = {};
      const ids = ['parentType', 'customParentId', 'fileName', 'fullText', 'description', 'mimeType', 'ownerType', 'destFolderId', 'dateAfter', 'dateBefore', 'relativeDays', 'relativeOperator', 'sizeLarger', 'sizeLargerUnit', 'sizeSmaller', 'sizeSmallerUnit'];
      ids.forEach(k => settings[k] = val(k));
      for(let i=1; i<=5; i++) settings['fileNameExclude'+i] = val('fileNameExclude'+i);
      settings.dateMode = dateMode;
      window.debounceSave(settings);
    }
  }

  // --- Dynamic Table Rendering ---
  function renderTable(files, append) {
    const ft = document.querySelector('#folderTable tbody'), flt = document.querySelector('#fileTable tbody');
    if (!append) { ft.innerHTML = ''; flt.innerHTML = ''; folderCount = 0; fileCount = 0; currentFolderIds = []; fileNamesMap = {}; }
    
    files.forEach(f => {
      const isF = f.mimeType === 'application/vnd.google-apps.folder';
      const target = isF ? ft : flt;
      if (isF) { folderCount++; currentFolderIds.push(f.id); } else { fileCount++; }
      fileNamesMap[f.id] = f.name;

      const row = document.createElement('tr');
      // CRITICAL: Ensure value attribute is correctly set to f.id
      row.innerHTML = `
        <td><input type="checkbox" class="file-check" value="${f.id}" onchange="updateSelectionCount()"></td>
        <td><div class="file-name-container"><span class="file-icon">${getFileIcon(f.mimeType, f.name)}</span><span>${f.name}</span></div></td>
        ${isF ? `<td id="stats-${f.id}" class="stats-cell">-</td>` : ''}
        <td>${f.modifiedTime ? new Date(f.modifiedTime).toLocaleString() : '-'}</td>
        ${!isF ? `<td>${f.size || '-'}</td>` : ''}
      `;
      target.appendChild(row);
    });
    
    document.getElementById('folderTabCount').textContent = folderCount;
    document.getElementById('fileTabCount').textContent = fileCount;
    document.getElementById('itemCountBadge').textContent = folderCount + fileCount;
    document.getElementById('itemCountBadge').style.display = 'inline-block';
    updateSelectionCount();
    if(!append) switchResultTab(fileCount > 0 ? 'files' : 'folders');
  }

  function getFileIcon(mime, name) {
    if (mime === 'application/vnd.google-apps.folder') return '📁';
    if (mime === 'text/markdown' || (name && name.toLowerCase().endsWith('.md'))) return 'Ⓜ️';
    if (mime.startsWith('image/')) return '📷';
    return '📄';
  }

  // --- Mock logic (Overridden in Production) ---
  function openPicker(id) { alert('Picker simulation (Production will open parent folder if ID exists)'); }
  function runSearch() { renderTable([{id:'m1', name:'Mock Folder', mimeType:'application/vnd.google-apps.folder', modifiedTime:new Date().toISOString()},{id:'m2', name:'Mock File.txt', mimeType:'text/plain', size:'10KB', modifiedTime:new Date().toISOString()}], false); document.getElementById('resultsSection').style.display = 'block'; document.getElementById('moveSection').style.display = 'block'; }
  function runMove() { alert('Move simulation complete'); }
</script>

</body>

<script>
  (function() {
    console.log('JavaScript.html loaded: Batch Move (Max 10) enabled');

    window.runWithRetry = function(funcName, args, onSuccess, onFailure, onBusy) {
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(err => {
          if (err.message && err.message.includes('SERVER_BUSY')) {
            if (onBusy) onBusy();
            setTimeout(() => window.runWithRetry(funcName, args, onSuccess, onFailure, onBusy), 1500);
          } else {
            console.error(err);
            if(onFailure) onFailure(err);
          }
        })[funcName](...args);
    };

    window.initApp = function() {
      google.script.run.withSuccessHandler(email => { 
        const el = document.getElementById('userEmail'); if(el) el.textContent = email; 
      }).getCurrentUserEmail();

      google.script.run.withSuccessHandler(settings => {
        if (settings) {
          const ids = ['parentType', 'customParentId', 'fileName', 'fileNameExclude1', 'fileNameExclude2', 'fileNameExclude3', 'fileNameExclude4', 'fileNameExclude5', 'fullText', 'description', 'mimeType', 'ownerType', 'destFolderId', 'dateAfter', 'dateBefore', 'relativeDays', 'relativeOperator', 'sizeLarger', 'sizeLargerUnit', 'sizeSmaller', 'sizeSmallerUnit'];
          ids.forEach(id => {
            const el = document.getElementById(id);
            if (el && settings[id] !== undefined) el.value = settings[id];
          });
          if (settings.dateMode) {
            const rb = document.querySelector(`input[name="dateMode"][value="${settings.dateMode}"]`);
            if (rb) rb.checked = true;
          }
          if (typeof toggleDateInputs === 'function') toggleDateInputs(false);
          if (typeof updateDestPath === 'function') updateDestPath();
        }
        if (typeof updateQuery === 'function') updateQuery(false);
      }).loadUserSettings();
    };

    window.debounceSave = function(settings) {
      if (window.saveTimeout) clearTimeout(window.saveTimeout);
      const status = document.getElementById('saveStatus');
      if(status) status.textContent = '保存中...';
      window.saveTimeout = setTimeout(() => {
        google.script.run.withSuccessHandler(() => {
          if(status) { status.textContent = '設定を自動保存しました'; setTimeout(() => status.textContent = '', 2000); }
        }).saveUserSettings(settings);
      }, 1000);
    };

    // --- Folder Picker ---
    window.openPicker = function(id) { 
      window.currentTargetInputId = id; 
      window.selectedFolderInfo = null;
      const btn = document.getElementById('confirmPickBtn'); if (btn) btn.disabled = true; 
      const nameEl = document.getElementById('selectedFolderName'); if (nameEl) nameEl.textContent = '未選択';
      const modal = document.getElementById('folderPickerModal'); if (modal) modal.style.display = 'flex';
      
      const currentId = document.getElementById(id)?.value;
      if (currentId) {
          google.script.run
            .withSuccessHandler(parentId => window.loadFolderList(parentId))
            .withFailureHandler(() => window.loadFolderList('root'))
            .getParentId(currentId);
      } else {
          window.loadFolderList('root');
      }
    };

    window.closePicker = function() { 
      const modal = document.getElementById('folderPickerModal'); if (modal) modal.style.display = 'none'; 
    };
    
    window.refreshPicker = function() { 
       const currentId = window.currentPickerFolderId || 'root'; window.loadFolderList(currentId, true);
    };
    
    window.selectFolderItem = function(id, name) {
      window.selectedFolderInfo = { id: id, name: name };
      const nameEl = document.getElementById('selectedFolderName'); if (nameEl) nameEl.textContent = `選択中: ${name}`;
      const btn = document.getElementById('confirmPickBtn'); if (btn) btn.disabled = false;
      document.querySelectorAll('.folder-item').forEach(el => {
        if (el.dataset.id === id) el.classList.add('selected'); else el.classList.remove('selected');
      });
    };

    window.confirmPicker = function() { 
      if (window.selectedFolderInfo) { 
        const input = document.getElementById(window.currentTargetInputId);
        if (input) {
            input.value = window.selectedFolderInfo.id;
            if (typeof updateQuery === 'function') updateQuery(true); 
            if (typeof updateDestPath === 'function') updateDestPath(); 
        }
        window.closePicker(); 
      } 
    };

    window.loadFolderList = function(parentId, bypassCache = false) {
      const body = document.getElementById('pickerBody');
      const breadcrumb = document.getElementById('pickerBreadcrumb');
      const indicator = document.getElementById('cacheIndicator');
      window.currentPickerFolderId = parentId; 
      window.selectedFolderInfo = null; 
      document.getElementById('confirmPickBtn').disabled = true;
      document.getElementById('selectedFolderName').textContent = '未選択';
      if (body) body.innerHTML = '<div style="padding:20px; text-align:center;">読み込み中...</div>';

      window.runWithRetry('getChildFolders', [parentId, bypassCache],
        (response) => {
          const { items, path, fromCache } = response;
          if (indicator) {
            indicator.style.display = 'inline-block';
            indicator.textContent = fromCache ? 'キャッシュ' : '最新';
            indicator.className = fromCache ? 'cache-status status-cached' : 'cache-status status-live';
          }
          if (breadcrumb && path) {
              breadcrumb.innerHTML = '';
              const upBtn = document.getElementById('pickerUpBtn');
              if (upBtn) {
                  if (path.length > 1) {
                      const parent = path[path.length - 2];
                      upBtn.onclick = () => window.loadFolderList(parent.id);
                      upBtn.disabled = false;
                  } else {
                      upBtn.disabled = true;
                  }
              }
              path.forEach((p, index) => {
                  const span = document.createElement('span');
                  span.textContent = p.name;
                  if (index < path.length - 1) {
                      span.className = 'crumb-link';
                      span.style.color = '#1a73e8'; span.style.cursor = 'pointer'; span.style.textDecoration = 'underline';
                      span.onclick = () => window.loadFolderList(p.id);
                      breadcrumb.appendChild(span); breadcrumb.appendChild(document.createTextNode(' > '));
                  } else {
                      span.style.fontWeight = 'bold'; breadcrumb.appendChild(span);
                  }
              });
          }
          if (body) {
            body.innerHTML = '';
            if (items.length === 0) {
              body.innerHTML = '<div style="padding:20px; text-align:center; color:#888;">フォルダなし</div>';
            } else {
              items.forEach(f => {
                const div = document.createElement('div');
                div.className = 'folder-item'; div.dataset.id = f.id;
                div.innerHTML = `📁 <span>${f.name}</span>`;
                div.onclick = () => window.selectFolderItem(f.id, f.name);
                div.ondblclick = () => window.loadFolderList(f.id);
                body.appendChild(div);
              });
            }
          }
        },
        (err) => { if (body) body.innerHTML = `<div style="padding:20px; color:red;">エラー: ${err.message}</div>`; },
        () => { if (body) body.innerHTML = '<div style="padding:20px; text-align:center;">待機中...</div>'; }
      );
    };

    window.updateDestPath = function() {
      const folderId = document.getElementById('destFolderId').value;
      const display = document.getElementById('destPathDisplay');
      if (!folderId) { if (display) display.textContent = ''; return; }
      if (display) display.textContent = '確認中...';
      if (window.pathDebounceTimer) clearTimeout(window.pathDebounceTimer);
      window.pathDebounceTimer = setTimeout(() => {
          google.script.run.withSuccessHandler(path => {
              if (display) display.textContent = path ? '📂 ' + path.join(' > ') : '❌ フォルダが見つかりません';
          }).withFailureHandler(err => { if (display) display.textContent = '⚠️ エラー: ' + err.message; }).getFolderPath(folderId);
      }, 500);
    };

    window.runSearch = function() {
      const q = document.getElementById('qResult').textContent;
      const btn = document.getElementById('searchBtn');
      const loading = document.getElementById('loadingSearch');
      window.currentLastQuery = q; window.loadedFilesCount = 0; window.folderCount = 0; window.fileCount = 0; window.currentFolderIds = []; window.fileNamesMap = {};
      if (btn) btn.disabled = true;
      if (loading) loading.style.display = 'block';
      document.getElementById('resultsSection').style.display = 'block';
      document.getElementById('moveSection').style.display = 'block';
      document.getElementById('searchSection').classList.add('accordion-collapsed');
      if(typeof toggleAccordion === 'function') toggleAccordion('resultsSection', true);
      document.getElementById('selectAllFolders').checked = false;
      document.getElementById('selectAllFiles').checked = false;
      if(typeof updateSelectionCount === 'function') updateSelectionCount();

      window.runWithRetry('searchFiles', [q, null, 20],
        (res) => {
          if(btn) btn.disabled = false;
          if(loading) loading.style.display = 'none';
          window.currentNextPageToken = res.nextPageToken;
          window.loadedFilesCount = res.files.length;
          if(typeof renderTable === 'function') renderTable(res.files, false);
          const fm = document.getElementById('fetchMoreArea');
          if(fm) fm.style.display = window.currentNextPageToken ? 'block' : 'none';
          if(btn) btn.textContent = 'この条件で検索を実行 (最大20件)';
        },
        (err) => {
          if(btn) btn.disabled = false;
          if(loading) loading.style.display = 'none';
          alert(err.message);
          if(btn) btn.textContent = 'この条件で検索を実行 (最大20件)';
        },
        () => { if(btn) btn.textContent = '待機中...'; }
      );
    };

    window.runFetchAll = function() {
      const btn = document.getElementById('fetchAllBtn');
      const limit = parseInt(document.getElementById('fetchLimit').value);
      const originalText = '追加で読み込む';
      let seconds = 0;
      if(btn) btn.disabled = true;
      const loading = document.getElementById('loadingSearch');
      if(loading) loading.style.display = 'block';
      if(window.fetchAllTimer) clearInterval(window.fetchAllTimer);
      window.fetchAllTimer = setInterval(() => { seconds++; if(btn) btn.textContent = `取得中... (${seconds}秒)`; }, 1000);
      const finish = () => { clearInterval(window.fetchAllTimer); if(btn) { btn.textContent = originalText; btn.disabled = false; } if(loading) loading.style.display = 'none'; };
      window.runWithRetry('fetchFiles', [window.currentLastQuery, window.currentNextPageToken, limit], (res) => {
        window.currentNextPageToken = res.nextPageToken;
        window.loadedFilesCount += res.files.length;
        if(typeof renderTable === 'function') renderTable(res.files, true);
        const fm = document.getElementById('fetchMoreArea');
        if(fm) fm.style.display = window.currentNextPageToken ? 'block' : 'none';
        finish();
      }, (err) => { alert(err.message); finish(); }, () => {});
    };

    // --- Updated: Sequential Batch Processing (Max 10) ---
    window.runMove = async function() {
      const destId = document.getElementById('destFolderId').value;
      const selectedIds = Array.from(document.querySelectorAll('tbody .file-check:checked')).map(c => c.value).filter(v => v && v !== 'on');
      if (!destId || !selectedIds.length) { alert('移動先フォルダと対象アイテムを選択してください。'); return; }
      if (!confirm(`${selectedIds.length} 件のアイテムを移動しますか？`)) return;

      const btn = document.getElementById('moveBtn'), pArea = document.getElementById('moveProgressArea'), pBar = document.getElementById('moveProgressBar'), pText = document.getElementById('moveProgressText'), logArea = document.getElementById('moveLog'), errorSummary = document.getElementById('moveErrorSummary');
      if(btn) btn.disabled = true; if(pArea) pArea.style.display = 'block'; if(logArea) logArea.innerHTML = ''; 
      if(errorSummary) { errorSummary.style.display = 'none'; errorSummary.innerHTML = '<h4>エラーレポート</h4><ul></ul>'; }
      
      let s = 0, e = 0; const errs = [];
      const batchSize = 10;
      const total = selectedIds.length;

      for (let i = 0; i < total; i += batchSize) {
        const chunk = selectedIds.slice(i, i + batchSize);
        const endRange = Math.min(i + batchSize, total);
        
        if(pText) pText.textContent = `${endRange}/${total} 処理中... (バッチ処理)`;
        if(pBar) pBar.style.width = Math.round((endRange / total) * 100) + '%';
        
        await new Promise(resolve => {
          window.runWithRetry('moveFiles', [chunk, destId], res => {
            s += res.success;
            e += res.error;
            if(res.error > 0) {
              res.details.forEach(msg => {
                if(logArea) logArea.innerHTML = `<div class="log-item"><span class="log-error">Error in batch</span>: ${msg}</div>` + logArea.innerHTML;
                errs.push(`<li>Batch processing error: ${msg}</li>`);
              });
            } else {
              if(logArea) logArea.innerHTML = `<div class="log-item"><span class="log-success">Batch Processed</span>: ${chunk.length} items moved</div>` + logArea.innerHTML;
            }
            resolve();
          }, err => {
            e += chunk.length;
            if(logArea) logArea.innerHTML = `<div class="log-item"><span class="log-error">Critical Failure</span>: ${err.message}</div>` + logArea.innerHTML;
            errs.push(`<li>Batch crash: ${err.message}</li>`);
            resolve();
          }, () => { 
            if(logArea) logArea.innerHTML = `<div class="log-item" style="color:#f9a825">Lock wait for batch...</div>` + logArea.innerHTML; 
          });
        });
      }

      if(btn) btn.disabled = false; if(pText) pText.textContent = '完了';
      if(e > 0) { if(errorSummary) { errorSummary.querySelector('ul').innerHTML = errs.join(''); errorSummary.style.display = 'block'; } alert(`完了: 成功${s} 失敗${e}`); }
      else { alert(`全件移動成功 (${s}件)`); window.runSearch(); }
    };

    window.runAnalyzeFolders = async function() {
      if (window.currentFolderIds.length === 0) return;
      const btn = document.getElementById('analyzeBtn');
      const originalText = btn ? btn.textContent : '';
      if (btn) { btn.disabled = true; btn.textContent = '集計中...'; }
      for (const folderId of window.currentFolderIds) {
        const cell = document.getElementById(`stats-${folderId}`);
        if (cell) cell.textContent = '...';
        await new Promise(resolve => {
          google.script.run.withSuccessHandler(res => {
            if (res.error) { if(cell) { cell.textContent = 'Err'; cell.title = res.error; } }
            else { const d = Object.entries(res.counts || {}).map(([t, c]) => `<span class="stat-item">${getFileIcon(t)} ${c}</span>`).join(' '); if(cell) cell.innerHTML = d || '(空)'; }
            resolve();
          }).withFailureHandler(() => { if(cell) cell.textContent = 'Err'; resolve(); }).getSingleFolderStats(folderId);
        });
      }
      if (btn) { btn.disabled = false; btn.textContent = originalText; }
    };
  })();
</script>

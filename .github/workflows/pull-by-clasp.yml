name: pull-by-clasp

# Ensure GITHUB_TOKEN can write to the repo
permissions:
  contents: write

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["list-by-drive-api"]  # trigger after the new housekeeping workflow completes
    types:
      - completed

jobs:
  pull:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: gas.moukaeritai.work
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Pull all Apps Script projects
        run: python3 housekeeping/pull-by-clasp/clasp-pull.py

      - name: Commit & Push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: sync GAS projects"
            git push origin HEAD:gas.moukaeritai.work
          else
            echo "No changes detected, skipping commit"
          fi

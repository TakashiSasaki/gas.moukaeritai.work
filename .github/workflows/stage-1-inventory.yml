name: stage-1-inventory

on:
  schedule:
    - cron: '0 */3 * * *' # Every 3 hours
  workflow_dispatch: # Allow manual triggering

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: gas-project-state-writer
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: gas.moukaeritai.work

      - name: Restore Google credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Fetch Drive inventory
        run: python automation/stage-1-inventory/fetch-drive-inventory.py

      - name: Reconcile canonical project registry
        run: python automation/stage-1-inventory/reconcile-project-registry.py

      - name: Generate public project index
        run: python automation/stage-1-inventory/generate-public-project-index.py

      - name: Validate generated repository state
        run: python .github/scripts/validate-automation.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Stage both retained/new snapshots and retention deletions.
          git add -A data/inventory/drive-api/snapshots
          git add projects/
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: automated project list update and metadata synchronization"
            git push origin HEAD:gas.moukaeritai.work
          else
            echo "No changes to commit"
          fi
